# /etc/systemd/sleep.conf.d/nosuspend-usb.conf
# Prevent system suspend/hibernate when using USB-attached external SSD
# as the root filesystem. Suspending while USB storage is mounted can
# cause the USB controller to reset, leading to ext4 filesystem corruption.

[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowSuspendThenHibernate=no
AllowHybridSleep=no
