# /etc/sysctl.d/99-ssd-optimized.conf
# I/O tuning for DRAM-less SSDs (e.g., ADATA SU650, Kingston A400)
#
# These parameters reduce write frequency and amplification by batching
# dirty page flushes into longer intervals. Safe for desktops with UPS
# or stable power; not recommended for servers without battery backup.

# Reduce swap aggressiveness (default: 60, zram default: 180)
# Lower value = prefer keeping data in RAM over swapping to disk
vm.swappiness = 150

# How long dirty pages can stay in memory before being written (centiseconds)
# Default: 3000 (30 sec). Extended to reduce write frequency on DRAM-less SSD.
vm.dirty_expire_centisecs = 6000

# How often the kernel's pdflush/flush thread wakes up to write dirty pages
# Default: 500 (5 sec). Extended to batch more writes together.
vm.dirty_writeback_centisecs = 1500
